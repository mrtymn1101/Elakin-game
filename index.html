<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İlkokul Hece Oyunu</title>
    <style>
        :root {
            --bg-color: #f0f7ff;
            --card-bg: #ffffff;
            --font-family: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            
            /* Renk Ayrımı */
            --first-group-color: #3b82f6; /* 1. Harf: Canlı Mavi */
            --second-group-color: #10b981; /* 2. Harf: Canlı Yeşil */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: #2f3542;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            color: #1e90ff;
            font-size: 1.8rem;
            margin: 0 0 4px 0;
        }

        /* SEVİYE (LEVEL) SEÇİM ALANI */
        .level-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }

        .level-btn {
            flex: 1;
            background: #eccc68;
            color: #2f3542;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #ffa502;
            transition: all 0.2s;
        }

        .level-btn.active {
            background: #ff7f50;
            color: white;
            box-shadow: 0 4px 0 #ff6348;
        }

        /* MOD SEÇİM SEKMELERİ */
        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 600px;
        }

        .tab-btn {
            flex: 1;
            background: #dfe4ea;
            color: #57606f;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #a4b0be;
        }

        .tab-btn.active {
            background: #8e44ad;
            color: white;
            box-shadow: 0 4px 0 #6c5ce7;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* HECE SEÇİM ŞERİDİ */
        .syllable-picker {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .picker-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #57606f;
            display: flex;
            justify-content: space-between;
        }

        .syllable-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: #f1f2f6;
            border-radius: 16px;
            border: 2px solid #e4e7eb;
        }

        .syllable-chip {
            background: white;
            border: 2px solid #ced6e0;
            padding: 6px 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 2px 0 #ced6e0;
        }

        .syllable-chip.active {
            background: #1e90ff;
            color: white;
            border-color: #0984e3;
            box-shadow: 0 3px 0 #0984e3;
        }

        /* ARABA VE YOL ALANI (SOLDAN SAĞA) */
        .road-wrapper {
            position: relative;
            width: 100%;
            height: 130px;
            background: #353b48;
            border-radius: 20px;
            border: 4px solid #2f3640;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            overflow: hidden;
            touch-action: none;
        }

        .road-dashed-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            border-top: 4px dashed #fbc531;
            transform: translateY(-50%);
            z-index: 1;
        }

        .letter-station {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: bold;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            border: 4px solid;
        }

        #startStation {
            border-color: var(--first-group-color);
            color: var(--first-group-color);
        }

        #endStation {
            border-color: var(--second-group-color);
            color: var(--second-group-color);
        }

        .car-element {
            position: absolute;
            left: 75px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3.2rem;
            cursor: grab;
            z-index: 4;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .car-element:active {
            cursor: grabbing;
            transform: translateY(-50%) scale(1.15);
        }

        /* SONUÇ VE OKUMA ALANI */
        .result-card {
            background: #fff9db;
            border: 3px dashed #f1c40f;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            min-height: 90px;
        }

        .result-display {
            font-size: 3.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1;
            color: #2f3542;
        }

        .result-hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        /* SERBEST BİRLEŞTİRME MODU VE RENK AYRIMI */
        .free-slots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: #eef5fc;
            padding: 15px;
            border-radius: 20px;
            border: 3px dashed #70a1ff;
        }

        .slot-box {
            width: 65px;
            height: 75px;
            background: white;
            border: 4px solid #ced6e0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            font-weight: bold;
            color: #2f3542;
        }

        .slot-box.slot-first {
            border-color: var(--first-group-color);
            color: var(--first-group-color);
        }

        .slot-box.slot-second {
            border-color: var(--second-group-color);
            color: var(--second-group-color);
        }

        .combine-action-btn {
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 0 #26af5f;
        }

        .combine-action-btn:disabled {
            background: #cbd5e1;
            box-shadow: 0 4px 0 #94a3b8;
            cursor: not-allowed;
        }

        .letters-column-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* 1. Kısım Mavi Kutu */
        .column-box-first {
            background: #eff6ff;
            padding: 10px;
            border-radius: 16px;
            border: 2px solid #bfdbfe;
        }

        /* 2. Kısım Yeşil Kutu */
        .column-box-second {
            background: #ecfdf5;
            padding: 10px;
            border-radius: 16px;
            border: 2px solid #a7f3d0;
        }

        .column-title-first {
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            color: var(--first-group-color);
        }

        .column-title-second {
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            color: var(--second-group-color);
        }

        .letter-buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        /* 1. Grup Harf Butonları (Mavi) */
        .btn-letter-first {
            background: white;
            border: 3px solid var(--first-group-color);
            color: var(--first-group-color);
            border-radius: 14px;
            padding: 10px 0;
            font-size: 1.7rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 0 #bfdbfe;
        }

        .btn-letter-first.selected {
            background: var(--first-group-color);
            color: white !important;
        }

        /* 2. Grup Harf Butonları (Yeşil) */
        .btn-letter-second {
            background: white;
            border: 3px solid var(--second-group-color);
            color: var(--second-group-color);
            border-radius: 14px;
            padding: 10px 0;
            font-size: 1.7rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 0 #a7f3d0;
        }

        .btn-letter-second.selected {
            background: var(--second-group-color);
            color: white !important;
        }

        .reset-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 0 #d63031;
        }

        .confetti-star {
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎈 İlkokul Hece Oyunu 🎈</h1>
    </header>

    <!-- SEVİYE SEÇİMİ -->
    <div class="level-container">
        <button class="level-btn active" id="btnLvl1" onclick="selectLevel(1)">1. Seviye: E-L-A-K-İ-N</button>
        <button class="level-btn" id="btnLvl2" onclick="selectLevel(2)">2. Seviye: O-M-U-T-Ü-Y</button>
    </div>

    <!-- MOD SEÇİM SEKMELERİ -->
    <div class="tab-menu">
        <button class="tab-btn active" id="btnCarTab" onclick="switchTab('carTab')">🏎️ Araba Sürüşü</button>
        <button class="tab-btn" id="btnFreeTab" onclick="switchTab('freeTab')">🔤 Serbest Birleştirme</button>
    </div>

    <div class="main-card">
        
        <!-- KATMAN 1: ARABA SÜRÜŞÜ MODU -->
        <div id="carTab" class="tab-content active">
            <div class="syllable-picker">
                <div class="picker-title">
                    <span>Müfredata Uygun Heceler:</span>
                    <span id="syllableCount" style="color:#1e90ff;"></span>
                </div>
                <div class="syllable-grid" id="syllableChipsContainer"></div>
            </div>

            <!-- Araba Pisti -->
            <div class="road-wrapper" id="roadContainer">
                <div class="road-dashed-line"></div>
                <div class="letter-station" id="startStation">E</div>
                <div class="car-element" id="carIcon">🏎️</div>
                <div class="letter-station" id="endStation">L</div>
            </div>

            <div class="result-card" onclick="speakCurrentSyllable()">
                <div class="result-display" id="carResultDisplay">EL</div>
                <span class="result-hint">Arabayı soldan sağa sür veya heceye dokun 🔊</span>
            </div>
        </div>

        <!-- KATMAN 2: SERBEST SEÇİM MODU (RENK AYRIMLI) -->
        <div id="freeTab" class="tab-content">
            <div class="free-slots">
                <div class="slot-box slot-first" id="slot1">?</div>
                <span style="font-size: 2rem; font-weight: bold; color: #a4b0be;">+</span>
                <div class="slot-box slot-second" id="slot2">?</div>
                <button class="combine-action-btn" id="btnCombine" onclick="combineFreeLetters()" disabled>OKU!</button>
            </div>

            <div class="result-card" onclick="speakFreeSyllable()">
                <div class="result-display" id="freeResultDisplay">✨</div>
                <span class="result-hint">Dinlemek için tıklayın 🔊</span>
            </div>

            <div class="letters-column-container">
                <!-- 1. Kısım: Mavi Tema -->
                <div class="column-box-first">
                    <div class="column-title-first">🟦 1. Harf</div>
                    <div class="letter-buttons-grid" id="gridFirstLetters"></div>
                </div>
                <!-- 2. Kısım: Yeşil Tema -->
                <div class="column-box-second">
                    <div class="column-title-second">🟩 2. Harf</div>
                    <div class="letter-buttons-grid" id="gridSecondLetters"></div>
                </div>
            </div>

            <button class="reset-btn" onclick="resetFreeMode()">Temizle 🗑️</button>
        </div>

    </div>

    <script>
        // MEB 1. SINIF HECE VERİTABANI
        const levelData = {
            1: {
                name: "E-L-A-K-İ-N",
                letters: ['e', 'l', 'a', 'k', 'i', 'n'],
                syllables: ["el", "le", "ak", "ka", "ek", "ke", "al", "la", "il", "li", "ik", "ki", "in", "ni", "an", "na"]
            },
            2: {
                name: "O-M-U-T-Ü-Y",
                letters: ['o', 'm', 'u', 't', 'ü', 'y'],
                syllables: ["om", "mo", "ot", "to", "um", "mu", "ut", "tu", "üm", "mü", "üt", "tü", "oy", "yo", "uy", "yu"]
            }
        };

        // KESİN TÜRKÇE TELAFUZ SÖZLÜĞÜ (Okuma Ses Hatalarını Önler)
        const trPhonetics = {
            'e': 'e', 'l': 'le', 'a': 'a', 'k': 'ke', 'i': 'i', 'n': 'ne',
            'o': 'o', 'm': 'me', 'u': 'u', 't': 'te', 'ü': 'ü', 'y': 'ye',
            'el': 'el', 'le': 'le', 'ak': 'ak', 'ka': 'ka', 'ek': 'ek', 'ke': 'ke',
            'al': 'al', 'la': 'la', 'il': 'il', 'li': 'li', 'ik': 'ik', 'ki': 'ki',
            'in': 'in', 'ni': 'ni', 'an': 'an', 'na': 'na', 'om': 'om', 'mo': 'mo',
            'ot': 'ot', 'to': 'to', 'um': 'um', 'mu': 'mu', 'ut': 'ut', 'tu': 'tu',
            'üm': 'üm', 'mü': 'mü', 'üt': 'üt', 'tü': 'tü', 'oy': 'oy', 'yo': 'yo',
            'uy': 'uy', 'yu': 'yu'
        };

        let currentLevel = 1;
        let activeCarSyllable = "el";
        let isDrivingSoundActive = false;
        let turkishVoice = null;

        function loadVoices() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                turkishVoice = voices.find(v => v.lang.startsWith('tr'));
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        window.onload = () => {
            selectLevel(1);
            setupCarDrivingLogic();
        };

        function selectLevel(lvl) {
            currentLevel = lvl;
            document.getElementById('btnLvl1').classList.toggle('active', lvl === 1);
            document.getElementById('btnLvl2').classList.toggle('active', lvl === 2);

            const data = levelData[lvl];
            activeCarSyllable = data.syllables[0];

            setupSyllableChips();
            selectCarSyllable(activeCarSyllable);
            setupFreeMode();
            resetFreeMode();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tabId === 'carTab') {
                document.getElementById('btnCarTab').classList.add('active');
                document.getElementById('carTab').classList.add('active');
            } else {
                document.getElementById('btnFreeTab').classList.add('active');
                document.getElementById('freeTab').classList.add('active');
            }
        }

        // --- ARABA MODU MANTIĞI ---
        function setupSyllableChips() {
            const container = document.getElementById('syllableChipsContainer');
            container.innerHTML = '';
            const list = levelData[currentLevel].syllables;

            list.forEach(syl => {
                const chip = document.createElement('div');
                chip.className = `syllable-chip ${syl === activeCarSyllable ? 'active' : ''}`;
                chip.innerText = syl.toUpperCase();
                chip.onclick = () => selectCarSyllable(syl);
                container.appendChild(chip);
            });
        }

        function selectCarSyllable(syl) {
            activeCarSyllable = syl;
            const char1 = syl[0];
            const char2 = syl[1];

            document.getElementById('startStation').innerText = char1.toUpperCase();
            document.getElementById('endStation').innerText = char2.toUpperCase();
            document.getElementById('carResultDisplay').innerText = syl.toUpperCase();

            const list = levelData[currentLevel].syllables;
            const index = list.indexOf(syl) + 1;
            document.getElementById('syllableCount').innerText = `(${index} / ${list.length})`;

            const chips = document.querySelectorAll('.syllable-chip');
            chips.forEach(c => {
                c.classList.toggle('active', c.innerText === syl.toUpperCase());
            });

            resetCarPosition();
        }

        function resetCarPosition() {
            const car = document.getElementById('carIcon');
            car.style.left = '75px';
        }

        // Arabayı Çekerken Soldaki Harf Sesi Uzasın Mantığı
        function setupCarDrivingLogic() {
            const car = document.getElementById('carIcon');
            const road = document.getElementById('roadContainer');
            let isDragging = false;

            const onStart = (e) => {
                e.preventDefault();
                isDragging = true;
                isDrivingSoundActive = true;
                
                // Soldaki harfin sesini uzatarak okumaya başla
                const firstChar = activeCarSyllable[0];
                speakContinuousChar(firstChar);
            };

            const onMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const roadRect = road.getBoundingClientRect();

                let newX = clientX - roadRect.left - 25;
                const minX = 75;
                const maxX = roadRect.width - 115;

                if (newX < minX) newX = minX;
                if (newX > maxX) newX = maxX;

                car.style.left = `${newX}px`;

                // Araba sağ harfe ulaştığında
                if (newX >= maxX - 2) {
                    isDragging = false;
                    isDrivingSoundActive = false;
                    triggerArrivalEffect();
                    // Sağdaki harf eklenerek hecenin tamamı okunur
                    speakCurrentSyllable();
                    resetCarPosition();
                }
            };

            const onEnd = () => {
                if (isDragging) {
                    isDragging = false;
                    isDrivingSoundActive = false;
                    window.speechSynthesis.cancel();
                    resetCarPosition();
                }
            };

            car.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            car.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
        }

        function triggerArrivalEffect() {
            const container = document.getElementById('carTab');
            for (let i = 0; i < 5; i++) {
                const star = document.createElement('div');
                star.className = 'confetti-star';
                star.innerText = '⭐';
                star.style.left = '80%';
                star.style.top = '50%';
                star.style.setProperty('--dx', `${(Math.random() - 0.5) * 150}px`);
                star.style.setProperty('--dy', `${-50 - Math.random() * 70}px`);
                container.appendChild(star);

                setTimeout(() => star.remove(), 800);
            }
        }

        function speakCurrentSyllable() {
            speakText(activeCarSyllable);
        }

        // --- SERBEST MOD MANTIĞI ---
        let selectedLetter1 = null;
        let selectedLetter2 = null;

        function setupFreeMode() {
            renderLetterGrid('gridFirstLetters', 1);
            renderLetterGrid('gridSecondLetters', 2);
        }

        function renderLetterGrid(containerId, slotNum) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const currentLetters = levelData[currentLevel].letters;

            currentLetters.forEach(char => {
                const btn = document.createElement('button');
                btn.className = slotNum === 1 ? 'btn-letter-first' : 'btn-letter-second';
                btn.innerText = char;
                btn.onclick = () => handleFreeLetterSelect(char, slotNum, btn, containerId);
                container.appendChild(btn);
            });
        }

        function handleFreeLetterSelect(char, slotNum, buttonEl, containerId) {
            const selector = slotNum === 1 ? '.btn-letter-first' : '.btn-letter-second';
            document.querySelectorAll(selector).forEach(b => b.classList.remove('selected'));
            buttonEl.classList.add('selected');

            if (slotNum === 1) {
                selectedLetter1 = char;
                document.getElementById('slot1').innerText = char.toUpperCase();
            } else {
                selectedLetter2 = char;
                document.getElementById('slot2').innerText = char.toUpperCase();
            }

            document.getElementById('btnCombine').disabled = !(selectedLetter1 && selectedLetter2);
        }

        function combineFreeLetters() {
            if (!selectedLetter1 || !selectedLetter2) return;
            const syl = selectedLetter1 + selectedLetter2;
            document.getElementById('freeResultDisplay').innerText = syl.toUpperCase();
            speakText(syl);
        }

        function speakFreeSyllable() {
            if (selectedLetter1 && selectedLetter2) {
                speakText(selectedLetter1 + selectedLetter2);
            }
        }

        function resetFreeMode() {
            selectedLetter1 = null;
            selectedLetter2 = null;

            document.getElementById('slot1').innerText = '?';
            document.getElementById('slot2').innerText = '?';
            document.getElementById('freeResultDisplay').innerText = '✨';
            document.getElementById('btnCombine').disabled = true;

            document.querySelectorAll('.btn-letter-first, .btn-letter-second').forEach(b => b.classList.remove('selected'));
        }

        // UZATILMIŞ İLK HARF SESİ (Araba Sürerken)
        function speakContinuousChar(char) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                // Harf sesini uzatmak için seslendirilecek metin tekrarlanır
                const extendedText = char === 'e' ? 'eeee' : (char === 'a' ? 'aaaa' : char);
                const utterance = new SpeechSynthesisUtterance(extendedText);
                utterance.lang = 'tr-TR';
                if (turkishVoice) utterance.voice = turkishVoice;
                utterance.rate = 0.6; // Yavaş ve uzatmalı okuma
                window.speechSynthesis.speak(utterance);
            }
        }

        // TÜRKÇE HECE KONTROLLÜ SESLENDİRME
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                // Fonetik Türkçe karşılığı varsa onu kullan
                const speakableText = trPhonetics[text.toLowerCase()] || text;

                const utterance = new SpeechSynthesisUtterance(speakableText);
                utterance.lang = 'tr-TR';
                
                if (turkishVoice) {
                    utterance.voice = turkishVoice;
                }

                utterance.rate = 0.75; // Net Türkçe okuma temposu
                utterance.pitch = 1.1;

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
